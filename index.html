<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ilmNet — a calm, curated library of Islamic lectures, books and scholarship."
    />
    <!-- Fase 6.0: the official IlmNet icon set (brand/ASSET_MANIFEST.txt). 32 px is the standard
         fallback; 16/48/64 are the extra sizes the package ships. No .svg and no .ico: the package has
         neither, and a self-made icon is explicitly out of scope. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Official token: brand/brand-tokens.css --ilmnet-bg (#F3EBDD). -->
    <meta name="theme-color" content="#F3EBDD" />
    <meta name="color-scheme" content="light" />
    <!-- Social preview defaults; per-route values (title, description, canonical, og:url/image) are set
         by src/lib/usePageMeta.ts. og:image must be absolute, so it is filled in by that hook too.
         Fase 6.0: still no default og:image. The delivered social card
         (brand/ilmnet-og-1200x630.png) has its payoff line clipped by the 1200x630 crop, so it is
         deliberately NOT published; see docs/CONTEXT.md §7n. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ilmNet" />
    <meta property="og:title" content="ilmNet — A quiet library for Islamic knowledge" />
    <meta
      property="og:description"
      content="A free, no-login library of Islamic lectures, books and scholarship — linking to the original source."
    />
    <meta name="twitter:card" content="summary" />
    <title>ilmNet — A quiet library for Islamic knowledge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
