services:
  postgres:
    image: postgres:17-alpine
    container_name: ilmnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ilmnet
      POSTGRES_USER: ilmnet
      POSTGRES_PASSWORD: ilmnet_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilmnet -d ilmnet"]
      interval: 5s
      timeout: 5s
      retries: 10

  # server is run locally via `npm run dev` for now.
  # Uncomment to run via docker later:
  # server:
  #   build: .
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     DATABASE_URL: postgresql://ilmnet:ilmnet_dev@postgres:5432/ilmnet?schema=public
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   command: ["npm", "run", "dev"]

volumes:
  postgres_data:
